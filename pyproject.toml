[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cisco-ise-mcp"
version = "1.1.0"
description = "MCP server for Cisco ISE — multi-deployment ERS, Open API, Monitoring, and Data Connect"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
dependencies = [
    # Floors exclude versions with known advisories (CVE-2026-59951, -116684/5/6).
    "mcp>=1.30,!=2.0.*,!=2.1.*,<3",
    "httpx>=0.28,<1",
    "python-dotenv>=1.2.2,<2",
    "oracledb>=2.0.0,<5",
    "keyring>=24.0,<26",
    "pyyaml>=6.0,<7",
    "jsonschema>=4.20,<5",
    # Oracle-dialect SQL parser for the ise_dc_query allow-list (pure Python, no deps).
    "sqlglot>=30,<31",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0.3",
    "pytest-asyncio>=0.23",
]
# Pin the MCP SDK major per venv. Only one ``mcp`` can be installed at a time,
# so "separate installs" means separate venvs built from this one repo:
#   pip install -e '.[v1]'   (or  uv sync --extra v1)
#   pip install -e '.[v2]'   (or  uv sync --extra v2)
v1 = ["mcp>=1.30,<2"]
v2 = ["mcp>=2.2,<3"]

[project.scripts]
cisco-ise-mcp = "cisco_ise_mcp.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cisco_ise_mcp.catalog" = ["*.json"]

# The v1/v2 extras pin conflicting mcp majors; only one is ever installed per
# venv. Declare them mutually exclusive so uv doesn't try to co-resolve them.
[tool.uv]
conflicts = [[{ extra = "v1" }, { extra = "v2" }]]

[tool.pytest.ini_options]
testpaths = ["tests"]
